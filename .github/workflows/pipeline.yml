name: CI Pipeline

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  # Unit tests should only run after lint passes to avoid wasting runner time on ill-formed code
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  # Build should only proceed after static analysis (lint) confirms clean code
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: dist/
          retention-days: 1

  # Integration tests validate compiled assets and must run after the build finishes
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: dist
      - run: npm run test:integration

  # Staging deploy requires all validation (both unit-tests and integration-tests) to pass first, and only deploys from main branch
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying to staging environment"

  # Production deploy must strictly follow a successful deployment to staging, restricted to the main branch
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploying to production environment"

  # Notification must run at the end of the pipeline regardless of whether upstream jobs passed or failed
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, unit-tests, build, integration-tests, deploy-staging, deploy-production]
    if: always()
    steps:
      - run: echo "Pipeline notification sent"
